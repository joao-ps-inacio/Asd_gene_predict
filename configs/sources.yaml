# Registo das fontes de dados brutos.
#
# Cada entrada descreve UM ficheiro em data/raw/<filename>.
# - url: de onde o `asd fetch` o descarrega. Fontes com `manual: true` têm de ser colocadas
#   à mão em data/raw/ (termos de utilização ou download atrás de login); o `asd fetch` só as verifica.
# - version: versão/release da fonte, para referência humana.
# - stage: etapa do pipeline que usa o ficheiro (permite `asd fetch --stage labels`).
#
# Os checksums SHA-256 NÃO estão aqui: ficam em configs/sources.lock.yaml, escrito pelo
# `asd fetch` no primeiro download e verificado nos seguintes (como um package-lock).

sources:
  hgnc:
    description: HGNC complete set — símbolos aprovados com IDs Ensembl, Entrez e MANE Select
    url: https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt
    filename: hgnc_complete_set.txt
    version: current   # o HGNC só publica a versão corrente neste URL; o lock fixa o conteúdo
    stage: gene_map

  mane:
    description: MANE summary — transcrito/proteína canónicos (MANE Select) por gene
    url: https://ftp.ncbi.nlm.nih.gov/refseq/MANE/MANE_human/release_1.4/MANE.GRCh38.v1.4.summary.txt.gz
    filename: MANE.GRCh38.v1.4.summary.txt.gz
    version: "1.4"
    stage: gene_map

  string_aliases:
    description: STRING v12 aliases humanos — liga as proteínas STRING (9606.ENSP...) aos genes Ensembl
    url: https://stringdb-downloads.org/download/protein.aliases.v12.0/9606.protein.aliases.v12.0.txt.gz
    filename: 9606.protein.aliases.v12.0.txt.gz
    version: "12.0"
    stage: gene_map

  string_links:
    description: STRING v12 interações humanas com combined_score (grafo PPI)
    url: https://stringdb-downloads.org/download/protein.links.v12.0/9606.protein.links.v12.0.txt.gz
    filename: 9606.protein.links.v12.0.txt.gz
    version: "12.0"
    stage: graph

  # SFARI e Krishnan vêm do repo original da tese, fixados num commit, para reproduzir
  # exatamente os mesmos labels.
  sfari:
    # Export de 19/01/2024 da release de 16/01/2024, tal como editado na tese: 9 IDs Ensembl
    # em falta preenchidos à mão (ex.: MET, AR, ADA) e RPS10P2-AS1 removido (sem ID).
    description: SFARI Gene, release de 16/01/2024 editada na tese (positivos)
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/01_Data_preparation/0_SFARI/sfari_ed_01_16_2024.csv
    filename: sfari_ed_01_16_2024.csv
    version: "2024-01-16"
    stage: labels

  krishnan_2016:
    description: Krishnan et al. (2016), Nat Neurosci 19:1454 — genes negativos, já em Ensembl
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/01_Data_preparation/1_pos_neg_genes/krish_ed/Krishnan_genes.csv
    filename: Krishnan_genes.csv
    version: "2016"
    stage: labels

  # Embeddings ProtT5 calculados na tese (1 vetor de 1024 por gene, mean pooling), para
  # reproduzir os resultados sem GPU. Os genes positivos e negativos estão todos neste ficheiro.
  legacy_prott5:
    description: Embeddings ProtT5 da tese (03_ML/sequence/Protein/gene_lists/complete.csv.gz)
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/03_ML/sequence/Protein/gene_lists/complete.csv.gz
    filename: legacy_prott5_complete.csv.gz
    version: thesis-2025
    stage: embeddings

  # Embeddings de grafo (DeepWalk sobre o STRING) usados no ranking de grafo da tese:
  # 500 dimensões, genes de treino (positivos e negativos).
  legacy_graph_deepwalk:
    description: Embeddings DeepWalk da tese (04_Validation/01_Ranked_list/graph/complete.csv.gz)
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/04_Validation/01_Ranked_list/graph/complete.csv.gz
    filename: legacy_graph_deepwalk_complete.csv.gz
    version: thesis-2025
    stage: embeddings

  # --- Validação temporal -----------------------------------------------------------------
  # Release recente do SFARI, para ver se os genes acrescentados depois de jan/2024 já
  # estavam no topo dos rankings da tese.
  sfari_2026q2:
    description: SFARI Gene, export de 01/10/2026 da release de 12/07/2026 (2026 Q2)
    url: https://gene.sfari.org/tools/
    filename: SFARI-Gene_genes_07-12-2026release_10-01-2026export.csv
    version: "2026-07-12"
    stage: validation
    manual: true
    instructions: >
      Descarregar o CSV "Human Gene" da release atual em https://gene.sfari.org/tools/ e
      guardá-lo em data/raw/ com este nome.

  # Rankings genome-wide gerados na tese (modelo treinado com cat_1_sd).
  legacy_rank_protein:
    description: Ranking da tese com ProtT5 + XGBoost (04_Validation/01_Ranked_list/sequence)
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/04_Validation/01_Ranked_list/sequence/Results/xgb_clean.csv
    filename: legacy_rank_protein_xgb.csv
    version: thesis-2025
    stage: validation

  legacy_rank_graph:
    description: Ranking da tese com DeepWalk (STRING) + LR (04_Validation/01_Ranked_list/graph)
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/04_Validation/01_Ranked_list/graph/Results/lr_clean.csv
    filename: legacy_rank_graph_deepwalk_lr.csv
    version: thesis-2025
    stage: validation

  # Baselines: um preditor útil tem de ganhar a explicações triviais.
  legacy_peptides:
    description: Sequências proteicas canónicas usadas na tese (comprimento da proteína)
    url: https://raw.githubusercontent.com/a59490/Tese_ASD_Gene_Pred/c3e7610062a569e498f9c05d78609d90a8679a9e/02_Embedding_creation/sequence/1_seq/protein/peptide_seq.csv
    filename: legacy_peptide_seq.csv
    version: thesis-2025
    stage: validation

  gnomad_constraint:
    description: gnomAD v4.1 constraint metrics (LOEUF), baseline de restrição genética
    url: https://storage.googleapis.com/gcp-public-data--gnomad/release/4.1/constraint/gnomad.v4.1.constraint_metrics.tsv
    filename: gnomad.v4.1.constraint_metrics.tsv
    version: "4.1"
    stage: validation

