# Configuração por defeito do pipeline. Valores herdados da tese, a rever.
seed: 42

labels:
  sfari_release: "2024-01-16"       # versão usada na tese; atualizar para uma release recente
  # Conjuntos de positivos testados na tese: genes SFARI com score <= max_score e, se
  # with_unscored, também os genes sem score (na release de 2024 são os sindrómicos, "_sd").
  positive_sets:
    cat_1: {max_score: 1, with_unscored: false}
    cat_1_sd: {max_score: 1, with_unscored: true}
    cat_1_2: {max_score: 2, with_unscored: false}
    cat_1_2_sd: {max_score: 2, with_unscored: true}
    cat_1_2_3: {max_score: 3, with_unscored: false}
    complete: {max_score: 3, with_unscored: true}
  negatives: krishnan_2016
  # true = recuperar pelo símbolo (via gene_map) os genes SFARI sem ID Ensembl. Não é
  # preciso para a release da tese (IDs já preenchidos); útil para releases novas.
  recover_missing_ensembl: false

embeddings:
  dna:
    model: zhihan1996/DNABERT-2-117M
    pooling: mean
    max_len: 10000
  protein:
    model: Rostlab/prot_t5_xl_half_uniref50-enc
    pooling: mean
  graph:
    source: string_ppi
    methods: [node2vec_skipgram, deepwalk_skipgram, first_order_line, second_order_line, hope]
    dim: 200

cv:
  n_splits: 5
  n_repeats: 1           # >1 para CV repetida (intervalos de confiança mais estáveis)
  inner_splits: 5        # folds da afinação de hiperparâmetros dentro de cada treino
  test_set: cat_1        # na tese, o teste é sempre feito nos genes cat_1
  scoring: average_precision   # métrica da afinação; a tese usava f1
